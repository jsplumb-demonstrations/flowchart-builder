
<div class="jtk-demo-main" id="jtk-demo-flowchart">

    <!-- main drawing area -->
    <div class="jtk-demo-canvas">

        <jsplumb-surface [view]="view"
                         [renderParams]="renderParams"
                         [toolkitParams]="toolkitParams"
                         url="/assets/copyright.json"/>

        <div class="controls">
            <!--
                A helper component that provides undo/redo, zoom to fit, etc.
            -->
            <jsplumb-controls/>

            <!--
                Helper component that provides image/svg export (when you are using a ShapeLibrary)
             -->
            <jsplumb-export-controls [imageOptions]="imageExportOptions" labelProperty="text"/>
        </div>

        <jsplumb-miniview/>
    </div>
    <div class="jtk-demo-rhs">
        <!-- the node palette -->
        <div class="sidebar node-palette">
            <jtk-shape-palette [dataGenerator]="dataGenerator" [initialSet]="initialShapeSet"/>
        </div>
        <!-- node/edge inspector -->
        <app-inspector [context]="flowchartContext"/>

    </div>
</div>
